[build-system]
requires = ['flit_core >=3.4,<4']
build-backend = 'flit_core.buildapi'

[project]
name = 'wood_stiffness_homogenization'
dynamic = ['version']
description = 'This code computes the multiscale stiffness of native, polymer-infiltrated, and delignified + infiltrated wood. '
authors = [
    {name = 'Königsberger Markus ', email = 'markus.koenigsberger@tuwien.ac.at'},
]
readme = 'README.md'
license = {file = 'LICENSE'}
requires-python = '>=3.11'
dependencies = [
    'trogon',
    'rich_click>=1.9,<2.0',
    'numpy',
    'scipy',
    'matplotlib',
]

[project.optional-dependencies]
tests = [
    'pytest',
]
gui = [
    "matplotlib",
]

[project.scripts]
aitw-wood-stiffness-homogenization = 'wood_stiffness_homogenization.cli:cli'

[tool.flit.module]
name = 'wood_stiffness_homogenization'

[tool.flynt]
line-length = 120
fail-on-change = true

[tool.isort]
force_sort_within_sections = true
include_trailing_comma = true
line_length = 120
multi_line_output = 3  # this configuration is compatible with yapf
