name: ci

on:
  push:
    branches:
      - main
    paths:
      - "wood_stiffness_homogenization/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
      - "examples/**"
  pull_request:

concurrency:
  group: ${{format('{0}:{1}:{2}', github.repository, github.ref, github.workflow)}}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-tests-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: pip-${{ matrix.python-version }}-tests

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: pip install .[tests]

      - name: Run tests
        run: pytest -sv --disable-warnings

  tests-eessi:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: eessi/github-action-eessi@v3

      - name: Install on top of EESSI and test
        run: |
          module purge
          module load EESSI/2025.06
          module load Python/3.13.5-GCCcore-14.3.0
          module load Tkinter/3.13.5-GCCcore-14.3.0
          module load SciPy-bundle/2025.07-gfbf-2025b
          module load matplotlib/3.10.5-gfbf-2025b

          python -m venv --system-site-packages venv
          source venv/bin/activate

          pip install .[tests]

          pytest -sv --disable-warnings
